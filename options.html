<!doctype html>
<meta charset="utf-8" />
<title>GitHub TLDR settings</title>
<style>
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 16px;
    width: 340px;
    color: #1f2328;
    background: #fff;
  }
  h1 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-weight: 600; font-size: 12px; margin: 12px 0 4px; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font: inherit;
  }
  button {
    margin-top: 14px;
    padding: 6px 14px;
    font: 600 13px/1.4 inherit;
    color: #fff;
    background: #1f883d;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .hint { font-size: 12px; color: #656d76; margin-top: 4px; }
  #status { margin-left: 10px; font-size: 12px; color: #1a7f37; }
</style>
<h1>GitHub TLDR</h1>

<label for="key">OpenAI API key</label>
<input id="key" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" />
<div class="hint">Stored locally in this browser profile, never sent anywhere but api.openai.com.</div>

<label for="model">Model</label>
<input id="model" type="text" placeholder="gpt-4o-mini" spellcheck="false" />

<label for="base">API base URL</label>
<input id="base" type="text" placeholder="https://api.openai.com/v1" spellcheck="false" />
<div class="hint">Change only for an OpenAI-compatible proxy.</div>

<button id="save">Save</button><span id="status"></span>

<script src="options.js"></script>
